<input type="text" id="userInput" class="input-text" placeholder="Nhập hoặc nói câu hỏi..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="btn-send" onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    // Cơ sở dữ liệu câu hỏi và file audio trả lời
    const KNOWLEDGE_BASE = [
        {
            keywords: ["dùng", "sử dụng", "pha", "cắt", "lát", "chế biến", "cách dùng", "uống", "như thế nào"],
            reply: "Hiện tại, nấm Linh Chi đóng hộp có thể dùng theo cách cắt lát pha trà. Mỗi lần dùng cắt 2 đến 3 lát mỏng dài khoảng 2 đốt ngón tay và pha với nước sôi vừa phải. Mỗi ngày dùng một cốc giúp cải thiện chất lượng giấc ngủ và hỗ trợ điều hòa hoạt động tim mạch.",
            audio: "audio.cach_su-dung.wav"
        },
        {
            keywords: ["công dụng", "tác dụng", "lợi ích", "ngủ", "tim", "sức khỏe", "tốt cho"],
            reply: "Mỗi ngày dùng một cốc trà nấm Linh Chi sẽ giúp cải thiện chất lượng giấc ngủ và hỗ trợ điều hòa hoạt động tim mạch.",
            audio: "audio.cach_su-dung.wav"
        },
        {
            keywords: ["bao nhiêu", "mấy lát", "liều lượng", "mấy cốc", "đốt ngón tay"],
            reply: "Mỗi lần dùng cắt 2 đến 3 lát mỏng dài khoảng 2 đốt ngón tay, pha nước sôi và uống 1 cốc mỗi ngày.",
            audio: "audio.cach_su-dung.wav"
        }
    ];

    const DEFAULT_REPLY = {
        reply: "Sản phẩm nấm Linh Chi đóng hộp dùng bằng cách cắt 2-3 lát mỏng pha nước sôi. Uống 1 cốc mỗi ngày giúp cải thiện giấc ngủ và điều hòa tim mạch.",
        audio: "audio.cach_su-dung.wav"
    };

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const micBtn = document.getElementById('micBtn');

    let currentAudio = null;

    // Tích hợp Web Speech API (Chuyển giọng nói thành văn bản - STT)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'vi-VN';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.remove('recording');
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            sendMessage();
        };
        recognition.onerror = () => {
            isRecording = false;
            micBtn.classList.remove('recording');
        };
    } else {
        micBtn.style.display = 'none';
        console.warn('Trình duyệt không hỗ trợ Web Speech API.');
    }

    micBtn.addEventListener('click', () => {
        if (!recognition) return;
        if (isRecording) {
            recognition.stop();
        } else {
            recognition.start();
        }
    });

    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getBotData(text) {
        const lowerText = text.toLowerCase();
        for (const item of KNOWLEDGE_BASE) {
            if (item.keywords.some(kw => lowerText.includes(kw))) {
                return item;
            }
        }
        return DEFAULT_REPLY;
    }

    // Hàm phát file âm thanh audio.cach_su-dung.wav
    function playAudioFile(audioSrc, fallbackText) {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }

        if (audioSrc) {
            currentAudio = new Audio(audioSrc);
            currentAudio.play().catch(error => {
                console.warn("Không thể phát file âm thanh tự động, dùng giọng đọc trình duyệt:", error);
                speakFallbackText(fallbackText);
            });
        } else {
            speakFallbackText(fallbackText);
        }
    }

    function speakFallbackText(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            window.speechSynthesis.speak(utterance);
        }
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';

        setTimeout(() => {
            const botData = getBotData(text);
            addMessage(botData.reply, 'bot');
            playAudioFile(botData.audio, botData.reply);
        }, 300);
    }
</script>
</body>
</html>
