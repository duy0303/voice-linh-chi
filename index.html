<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trợ Lý Voice CSKH - Nấm Linh Chi</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background: #f0f2f5; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 14px 28px; 
            border-radius: 30px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            transition: all 0.3s ease; 
        }
        button:hover { background: #0056b3; }
        button.active { background: #dc3545; animation: pulse 1.5s infinite; }
        .box-container { text-align: left; margin-top: 10px; }
        .label { font-weight: bold; color: #555; margin-bottom: 5px; font-size: 14px; }
        .box { 
            padding: 12px 15px; 
            border: 1px solid #e0e0e0; 
            border-radius: 8px; 
            background: #fafafa; 
            min-height: 40px; 
            margin-bottom: 15px; 
            font-size: 15px; 
            line-height: 1.5; 
            word-wrap: break-word; 
        }
        .ai-reply { background: #e7f3ff; border-color: #b6d4fe; color: #084298; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Trợ Lý Tư Vấn Nấm Linh Chi</h2>
    <button id="btn-record">🎤 Bấm để hỏi AI</button>

    <div class="box-container">
        <div class="label">🗣️ Bạn hỏi:</div>
        <div id="user-text" class="box">Đang chờ bạn nói...</div>

        <div class="label">🤖 AI Trả lời:</div>
        <div id="ai-text" class="box ai-reply">Chưa có phản hồi...</div>
    </div>
</div>

<script>
    const btnRecord = document.getElementById('btn-record');
    const userTextBox = document.getElementById('user-text');
    const aiTextBox = document.getElementById('ai-text');

    // 1. KỊCH BẢN TƯ VẤN NẤM LINH CHI (ĐÃ CẬP NHẬT FILE .MP3)
    const scenarios = [
        {
            keywords: [
                'cách dùng', 'sử dụng', 'pha trà', 'dùng thế nào', 'uống thế nào','chế biến', 'linh chi', 'nấm linh chi', 'tác dụng', 'giấc ngủ', 'tim mạch'
            ],
            // Đường dẫn file MP3 nằm trực tiếp ở nhánh main / thư mục gốc
            audioFile: 'audio.cach_su-dung.mp3',
            displayText: 'Hiện tại, nấm Linh Chi đóng hộp của chúng tôi có thể dùng theo cách cắt lát pha trà. Mỗi lần dùng có thể cắt 2 đến 3 lát mỏng dài khoảng hai đốt ngón tay và pha với một lượng nước sôi vừa phải. Mỗi ngày dùng một cốc sẽ giúp cải thiện chất lượng giấc ngủ và hỗ trợ điều hòa hoạt động tim mạch.'
        }
    ];

    const defaultScenario = {
        audioFile: 'audio.cach_su-dung.mp3',
        displayText: 'Dạ em chưa nghe rõ. Anh/chị có thể hỏi lại về cách sử dụng hoặc tác dụng của Nấm Linh Chi đóng hộp được không ạ?'
    };

    let currentAudio = null;

    // 2. KHỞI TẠO CÔNG CỤ NHẬN DẠNG GIỌNG NÓI (WEB SPEECH API)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Trình duyệt không hỗ trợ Web Speech API! Vui lòng truy cập bằng Google Chrome hoặc Microsoft Edge.");
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'vi-VN';

        btnRecord.addEventListener('click', () => {
            if (currentAudio) { 
                currentAudio.pause(); 
                currentAudio.currentTime = 0;
            }
            recognition.start();
        });

        recognition.onstart = () => {
            btnRecord.textContent = "🔴 Đang lắng nghe...";
            btnRecord.classList.add('active');
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase();
            userTextBox.textContent = event.results[0][0].transcript;

            matchAndPlayAudio(transcript);
        };

        recognition.onend = () => {
            btnRecord.textContent = "🎤 Bấm để hỏi AI";
            btnRecord.classList.remove('active');
        };

        recognition.onerror = (event) => {
            btnRecord.textContent = "🎤 Bấm để hỏi AI";
            btnRecord.classList.remove('active');
            userTextBox.textContent = "Lỗi nhận dạng âm thanh: " + event.error;
        };
    }

    // 3. HÀM XỬ LÝ KHỚP CÂU HỎI VÀ PHÁT AUDIO (.MP3)
    function matchAndPlayAudio(inputText) {
        const matched = scenarios.find(item => 
            item.keywords.some(kw => inputText.includes(kw))
        );

        const target = matched ? matched : defaultScenario;

        aiTextBox.textContent = target.displayText;

        // Tải và phát file MP3
        currentAudio = new Audio(target.audioFile);
        currentAudio.play().catch(error => {console.error("Không thể phát file âm thanh:", error);
            alert("Lỗi: Hãy chắc chắn bạn đã tải file '" + target.audioFile + "' lên thư mục chính (main) của GitHub!");
        });
    }
</script>

</body>
</html>
