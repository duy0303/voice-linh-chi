<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice CSKH</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 480px; text-align: center; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 25px; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
        button.active { background: #dc3545; }
        .box { margin-top: 10px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; text-align: left; background: #fafafa; min-height: 40px; }
        .ai-reply { background: #e7f3ff; border-color: #b6d4fe; color: #084298; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Trợ Lý Voice CSKH</h2>
    <button id="btn-record">🎤 Nhấn để nói</button>

    <div><strong>Khách hỏi:</strong></div>
    <div id="user-text" class="box">Đang chờ bạn nói...</div>

    <div style="margin-top: 15px;"><strong>AI Trả lời:</strong></div>
    <div id="ai-text" class="box ai-reply">Chưa có phản hồi...</div>
</div>

<script>
    const btnRecord = document.getElementById('btn-record');
    const userTextBox = document.getElementById('user-text');
    const aiTextBox = document.getElementById('ai-text');

    // 1. KHAI BÁO KỊCH BẢN: Danh sách Từ Khóa - File Âm Thanh - Văn Bản Hiển Thị
    const scenarios = [
        {
            keywords: ['cách sử dụng', 'uống thế nào', 'dùng ra sao', 'cần cắt lát không'],
            audioFile: 'audio.cach_su-dung.wav',
            displayText:'Hiện tại, nấm Linh Chi đóng hộp của chúng tôi có thể dùng theo cách cắt lát pha trà. Mỗi lần dùng có thể cắt 2 đến 3 lát mỏng dài khoảng hai đốt ngón tay và pha với một lượng nước sôi vừa phải. Mỗi ngày dùng một cốc sẽ giúp cải thiện chất lượng giấc ngủ và hỗ trợ điều hòa hoạt động tim mạch.'
        }
    
    // 2. KHỞI TẠO CÔNG CỤ NHẬN DẠNG GIỌNG NÓI (STT)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Trình duyệt không hỗ trợ! Vui lòng dùng Chrome hoặc Edge.");
    } else {'
    let currentAudio = null; // Quản lý file âm thanh đang phát
const recognition = new SpeechRecognition();
        recognition.lang = 'vi-VN';

        btnRecord.addEventListener('click', () => {
            // Ngừng phát âm thanh cũ nếu đang chạy
            if (currentAudio) { currentAudio.pause(); }
            recognition.start();
        });

        recognition.onstart = () => {
            btnRecord.textContent = "Đang lắng nghe...";
            btnRecord.classList.add('active');
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript.toLowerCase();
            userTextBox.textContent = transcript;

            // Xử lý tìm câu trả lời chính xác
            matchAndPlayAudio(transcript);
        };

        recognition.onend = () => {
            btnRecord.textContent = "🎤 Nhấn để nói";
            btnRecord.classList.remove('active');
        };
    }

    // 3. HÀM XỬ LÝ KHỚP CÂU HỎI VÀ PHÁT FILE GHI ÂM

            // Đường dẫn đến file ghi âm bạn đã tải lên GitHub
            audioFile: 'audio.cach_su-dung.wav',
            
            // Văn bản hiển thị tương ứng với file âm thanh
            displayText: 'Hiện tại, nấm Linh Chi đóng hộp của chúng tôi có thể dùng theo cách cắt lát pha trà. Mỗi lần dùng có thể cắt 2 đến 3 lát mỏng dài khoảng hai đốt ngón tay và pha với một lượng nước sôi vừa phải. Mỗi ngày dùng một cốc sẽ giúp cải thiện chất lượng giấc ngủ và hỗ trợ điều hòa hoạt động tim mạch.'
        }
    ];

        });
    }
</script>

</body>
</html>
